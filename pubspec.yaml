name: smart_admin_dashboard
description: A professional e-commerce admin dashboard app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend and Real-time data
  supabase_flutter: ^2.0.0

  # Professional Charts
  fl_chart: ^0.66.0

  # Responsive Layout
  responsive_framework: ^1.1.0

  # UI/Icons
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0

  # State Management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
